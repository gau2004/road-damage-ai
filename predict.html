<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predict - Road Damage Classification</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">🛣️ Road Damage AI</div>
    <div class="nav-links">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('predict') }}" class="active">Predict</a>
      <a href="{{ url_for('configure') }}">Configure &amp; Retrain</a>
    </div>
  </nav>

  <main class="container">
    <h1>Predict Road Condition</h1>

    {% if not model_ready %}
    <div class="alert alert-warning">
      No trained model found yet. Please go to <a href="{{ url_for('configure') }}">Configure &amp; Retrain</a>
      and train a model first.
    </div>
    {% endif %}

    <div class="upload-card">
      <form id="predict-form">
        <label for="image-input" class="upload-drop">
          <span id="upload-label-text">📤 Click to choose a road image</span>
          <input type="file" id="image-input" name="image" accept="image/*" hidden>
        </label>
        <img id="preview-img" class="preview-img hidden" alt="preview">
        <button type="submit" class="btn-primary" {{ 'disabled' if not model_ready }}>Predict</button>
      </form>

      <div id="loading" class="loading hidden">🔄 Running inference...</div>

      <div id="result" class="result-box hidden">
        <h2 id="result-label"></h2>
        <div class="confidence-bar-outer">
          <div id="confidence-bar" class="confidence-bar-inner"></div>
        </div>
        <p id="result-confidence"></p>
      </div>

      <div id="error-box" class="alert alert-error hidden"></div>
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
